window_step_ms: 10
train_dir: .cache/trained/yo_franky_physical_v2

features:
  - features_dir: .cache/features/positive
    sampling_weight: 4.0
    penalty_weight: 1.0
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: .cache/features/hard-negative
    sampling_weight: 6.0
    penalty_weight: 2.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: .cache/features/physical-corpus-v2/positive
    sampling_weight: 6.0
    penalty_weight: 1.0
    truth: true
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: .cache/features/physical-corpus-v2/hard-negative
    sampling_weight: 16.0
    penalty_weight: 4.0
    truth: false
    truncation_strategy: truncate_start
    type: mmap
  - features_dir: .cache/negative-datasets/speech
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: .cache/negative-datasets/dinner_party
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: .cache/negative-datasets/no_speech
    sampling_weight: 5.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: random
    type: mmap
  - features_dir: .cache/negative-datasets/dinner_party_eval
    sampling_weight: 0.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: split
    type: mmap

training_steps: [1500]
positive_class_weight: [1]
negative_class_weight: [20]
learning_rates: [0.0001]
batch_size: 128
time_mask_max_size: [0]
time_mask_count: [0]
freq_mask_max_size: [0]
freq_mask_count: [0]
eval_step_interval: 250
clip_duration_ms: 1500
target_minimization: 0.9
minimization_metric: null
maximization_metric: average_viable_recall
